
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate and plot displacement</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #222;
            background-color: white;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 12px;
        }

        label {
            width: 125px;
            font-size: 14px;
        }

        input {
            width: 110px;
            padding: 5px;
            border: 1px solid #bbb;
            border-radius: 2px;
            font-size: 13px;
        }

        input[readonly] {
            background-color: #f3f3f3;
        }

        select {
            padding: 3px;
            border: 1px solid #aaa;
            background-color: white;
        }

        button {
            padding: 7px 18px;
            margin: 2px 0 20px;
            border: 1px solid #aaa;
            background-color: #eee;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }

        .chart-container {
            width: 100%;
            max-width: 650px;
            height: 300px;
        }

        @media (max-width: 480px) {
            body {
                margin: 12px;
            }

            h2 {
                font-size: 21px;
            }

            .chart-container {
                height: 260px;
            }
        }
    </style>
</head>

<body>
    <h2>Calculate and plot displacement</h2>

    <form id="displacementForm">

        <div class="form-group">
            <label for="u">Initial velocity (u):</label>
            <input type="number" id="u" value="0" step="any" required>
            <span>m/s</span>
        </div>

        <div class="form-group">
            <label for="a">Acceleration (a):</label>
            <input type="number" id="a" value="1.5" step="any" required>
            <span>m/s<sup>2</sup></span>
        </div>

        <div class="form-group">
            <label for="t">Total time (t):</label>
            <input type="number" id="t" value="10" min="0" step="any" required>
            <span>s</span>
        </div>

        <div class="form-group">
            <label for="displacement">Displacement (s):</label>
            <input type="text" id="displacement" value="75.00" readonly>
            <span>m</span>
        </div>

        <div class="form-group">
            <label for="samples">Number of samples:</label>
            <select id="samples">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
                <option value="60">60</option>
                <option value="70">70</option>
                <option value="80">80</option>
                <option value="90">90</option>
                <option value="100">100</option>
            </select>
        </div>

        <button type="submit">Calculate</button>

    </form>

    <div class="chart-container">
        <canvas id="displacementChart"></canvas>
    </div>

    <script>
        const form = document.getElementById("displacementForm");
        const uInput = document.getElementById("u");
        const aInput = document.getElementById("a");
        const tInput = document.getElementById("t");
        const displacementInput = document.getElementById("displacement");
        const samplesInput = document.getElementById("samples");

        // Calculate displacement
        function calculateDisplacement(u, a, time) {
            return u * time + 0.5 * a * time * time;
        }

        // Generate data from 0 to double the total time
        function generateData(u, a, t, intervals) {
            const points = [];
            const endTime = 2 * t;

            for (let i = 0; i <= intervals; i++) {
                const time = endTime * i / intervals;

                points.push({
                    x: time,
                    y: calculateDisplacement(u, a, time)
                });
            }

            return points;
        }

        // Create chart
        const chart = new Chart(
            document.getElementById("displacementChart"),
            {
                type: "scatter",
                data: {
                    datasets: [
                        {
                            label: "s = ut + (1/2)at^2",
                            data: [],
                            showLine: true,
                            borderColor: "#4bc0c0",
                            backgroundColor: "#4bc0c0",
                            borderWidth: 2,
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: "Selected time",
                            data: [],
                            showLine: false,
                            backgroundColor: "red",
                            borderColor: "red",
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: "linear",
                            min: 0,
                            title: {
                                display: true,
                                text: "Time (t)"
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: "Displacement (s)"
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                filter: function(item) {
                                    return item.datasetIndex === 0;
                                }
                            }
                        }
                    }
                }
            }
        );

        // Update calculation and graph
        function updateChart() {
            const u = Number(uInput.value);
            const a = Number(aInput.value);
            const t = Number(tInput.value);
            const intervals = Number(samplesInput.value);

            if (
                uInput.value.trim() === "" ||
                aInput.value.trim() === "" ||
                tInput.value.trim() === "" ||
                !Number.isFinite(u) ||
                !Number.isFinite(a) ||
                !Number.isFinite(t) ||
                t < 0
            ) {
                alert("Please enter valid values. Time must be 0 or greater.");
                return;
            }

            // Displacement at the selected time t
            const displacement = calculateDisplacement(u, a, t);
            displacementInput.value = displacement.toFixed(2);

            // Plot from 0 to 2t
            chart.data.datasets[0].data =
                generateData(u, a, t, intervals);

            // Red point at the original time t
            chart.data.datasets[1].data = [
                {
                    x: t,
                    y: displacement
                }
            ];

            chart.options.scales.x.max = 2 * t;
            chart.update();
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            updateChart();
        });

        // Display initial graph
        updateChart();
    </script>
</body>
</html>
